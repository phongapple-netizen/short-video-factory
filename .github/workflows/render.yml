name: Render MP4 video

on:
  workflow_dispatch:
    inputs:
      composition:
        description: '选择案例（ChibiMapPreview仅为地图04/05草稿）'
        required: true
        default: 'MathExplainer'
        type: choice
        options:
          - MathExplainer
          - TrapezoidExplainer
          - ChibiMapFull
          - ChibiMapPreview
          - ChibiHistory
          - PirateCoins
          - FactoryDemo
      quality:
        description: 'final = 1080x1920 CRF16; draft = half scale CRF22'
        required: true
        default: final
        type: choice
        options:
          - final
          - draft

permissions:
  contents: read

jobs:
  render:
    name: Render ${{ inputs.composition }} (${{ inputs.quality }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chinese subtitle fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk libnss3 libgbm1 libatk-bridge2.0-0
          fc-cache -f
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check project
        run: npm run typecheck
      - name: Check registry and workflow
        run: npm run check:factory && npm run registry:check
      - name: Ensure Chrome Headless Shell
        run: npx remotion browser ensure
      - name: List compositions
        run: npm run compositions
      - name: Render chosen composition
        shell: bash
        env:
          COMPOSITION: ${{ inputs.composition }}
          QUALITY: ${{ inputs.quality }}
        run: |
          set -euo pipefail
          npm run render:case -- "$COMPOSITION" "$QUALITY"
      - name: Upload video, cover, subtitles and audio verification
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.composition }}-${{ inputs.quality }}
          path: |
            out/${{ inputs.composition }}/${{ inputs.composition }}.mp4
            out/${{ inputs.composition }}/cover.png
            out/${{ inputs.composition }}/captions.srt
            out/${{ inputs.composition }}/audio-report.json
            out/${{ inputs.composition }}/verification.json
            out/${{ inputs.composition }}/ffprobe.json
            out/${{ inputs.composition }}/delivery.json
          if-no-files-found: error
          retention-days: 14
