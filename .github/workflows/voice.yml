name: Generate narration

# 在 GitHub 服务器上生成配音（Edge TTS，失败时用仓库 Secret 中的 Azure），
# 把配音缓存与实测时间轴提交回运行所在的分支。密钥只通过环境变量传入，不写文件、不打印。

on:
  workflow_dispatch:
    inputs:
      case:
        description: '案例 ID 或 key（使用 content.json 的新模板案例）'
        required: true
        default: 'PirateGoldEp1'
        type: string

permissions:
  contents: write

concurrency:
  group: voice-${{ github.ref }}
  cancel-in-progress: false

jobs:
  voice:
    name: Narration for ${{ inputs.case }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Refuse direct commits to main
        if: github.ref == 'refs/heads/main'
        run: |
          echo "请在功能分支上运行此工作流，不直接提交到 main。"
          exit 1
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools and voice dependencies
        timeout-minutes: 10
        run: |
          if ! command -v ffprobe >/dev/null; then
            # man-db 触发器在 ubuntu-24.04 runner 上可能卡住十几分钟
            sudo rm -f /var/lib/man-db/auto-update
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python -m pip install -r scripts/requirements.txt
      - name: Generate narration and measured timeline
        env:
          CASE: ${{ inputs.case }}
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
        run: |
          set -euo pipefail
          [[ "$CASE" =~ ^[A-Za-z][A-Za-z0-9_-]*$ ]] || { echo "案例 ID 非法"; exit 1; }
          python3 scripts/prepare-voice.py "$CASE"
      - name: Commit narration back to the branch
        env:
          CASE: ${{ inputs.case }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/assets src/videos cases.json README.md .github/workflows/render.yml
          if git diff --cached --quiet; then echo "配音缓存与时间轴没有变化"; exit 0; fi
          git commit -m "Generate measured narration for $CASE"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Validate factory rules with measured timing
        run: node scripts/check-factory.mjs && node scripts/sync-registry.mjs --check
